<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>大肥鱼 · B站活动足迹</title>
<style>
  :root {
    --bg: #0e1015;
    --card: #161a22;
    --card2: #1b202a;
    --line: #262c38;
    --fg: #e7eaf2;
    --dim: #8a93a8;
    --watch: #5aa9ff;
    --comment: #ffb454;
    --dynamic: #b07dff;
    --favorite: #ffd166;
    --dm: #57d9a3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.6 -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 28px 20px 80px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: .5px; }
  .sub { color: var(--dim); font-size: 12.5px; }
  .btn {
    background: var(--card2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; font-size: 12.5px; cursor: pointer;
  }
  .btn:hover { border-color: #3a455f; }
  .btn:active { transform: translateY(1px); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 20px 0 6px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  }
  .card .k { color: var(--dim); font-size: 12px; }
  .card .v { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .card .v small { font-size: 12px; color: var(--dim); font-weight: 400; margin-left: 6px; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 10px; align-items: center; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--dim);
    border-radius: 999px; padding: 5px 12px; font-size: 12.5px; cursor: pointer;
  }
  .chip.on { color: var(--fg); border-color: #3d4964; background: var(--card2); }
  .search {
    margin-left: auto; background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; color: var(--fg); padding: 6px 10px; font-size: 12.5px; min-width: 180px;
  }
  .search:focus { outline: none; border-color: #3d4964; }

  .day { margin-top: 26px; }
  .dayhead {
    display: flex; align-items: baseline; gap: 8px; color: var(--dim); font-size: 12.5px;
    padding-bottom: 6px; border-bottom: 1px solid var(--line); margin-bottom: 6px;
  }
  .dayhead b { color: var(--fg); font-size: 13px; font-weight: 600; }

  .row {
    display: grid; grid-template-columns: 52px 74px 1fr; gap: 10px;
    padding: 9px 6px; border-radius: 8px; align-items: start;
  }
  .row:hover { background: #12151c; }
  .time { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 2px; }
  .badge {
    display: inline-block; text-align: center; font-size: 11.5px; border-radius: 6px;
    padding: 1px 0; width: 68px; border: 1px solid transparent;
  }
  .badge.watch { color: var(--watch); background: rgba(90,169,255,.1); border-color: rgba(90,169,255,.25); }
  .badge.comment { color: var(--comment); background: rgba(255,180,84,.1); border-color: rgba(255,180,84,.25); }
  .badge.dynamic { color: var(--dynamic); background: rgba(176,125,255,.1); border-color: rgba(176,125,255,.25); }
  .badge.favorite { color: var(--favorite); background: rgba(255,209,102,.1); border-color: rgba(255,209,102,.25); }
  .badge.dm { color: var(--dm); background: rgba(87,217,163,.1); border-color: rgba(87,217,163,.25); }

  .title { font-size: 13.5px; }
  .title a { color: var(--fg); text-decoration: none; }
  .title a:hover { text-decoration: underline; }
  .detail { color: #c3c9d8; font-size: 12.5px; margin-top: 3px; white-space: pre-wrap; }
  .detail .at { color: var(--comment); }
  .meta { color: var(--dim); font-size: 11.5px; margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; }
  .meta .tag { border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }

  .empty { color: var(--dim); text-align: center; padding: 40px 0; font-size: 13px; }
  .err { color: #ff7b72; background: rgba(255,123,114,.08); border: 1px solid rgba(255,123,114,.25);
         border-radius: 10px; padding: 10px 12px; margin-top: 16px; font-size: 12.5px; line-height: 1.9; }
  .err code { background: #0b0d12; border: 1px solid var(--line); border-radius: 5px;
              padding: 1px 6px; color: #cfd6e6; font-size: 12px; }
  footer { margin-top: 40px; color: #5c6478; font-size: 11.5px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>大肥鱼 · B站活动足迹</h1>
      <div class="sub" id="sub">加载中…</div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn" id="auto">自动刷新：开</button>
      <button class="btn" id="refresh">刷新</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="chips" id="chips">
    <input class="search" id="q" placeholder="搜标题 / 内容 / UP" />
  </div>

  <div id="list"></div>
  <footer>只读后台：数据来自她自己的记账（watch-history / quota / bili-memory / favorites），30 秒自动刷新。</footer>
</div>

<script>
const KINDS = {
  watch:    { label: '观看', order: 0 },
  comment:  { label: '评论', order: 1 },
  dynamic:  { label: '动态', order: 2 },
  favorite: { label: '收藏', order: 3 },
  dm:       { label: '私聊', order: 4 },
};
let DATA = null;
let filter = 'all';
let query = '';
let autoTimer = null;
let autoOn = true;

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, '0');
const hhmm = (iso) => { const d = new Date(iso); return Number.isFinite(d.getTime()) ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : '--:--'; };
const dayKey = (iso) => { const d = new Date(iso); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const weekday = (iso) => ['周日','周一','周二','周三','周四','周五','周六'][new Date(iso).getDay()];
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderStats() {
  const s = DATA.stats || { total: 0, today: 0, week: 0, byKind: {} };
  const cards = [
    ['总活动', s.total, ''],
    ['今天', s.today, ''],
    ['最近 7 天', s.week, ''],
    ['观看', s.byKind.watch || 0, '条'],
    ['评论', s.byKind.comment || 0, '条'],
    ['动态', s.byKind.dynamic || 0, '条'],
  ];
  $('stats').innerHTML = cards.map(([k, v, unit]) =>
    `<div class="card"><div class="k">${k}</div><div class="v">${v}<small>${unit}</small></div></div>`).join('');
}

function renderChips() {
  const total = DATA.events.length;
  const counts = DATA.stats.byKind || {};
  const items = [['all', '全部', total], ...Object.entries(KINDS).map(([k, v]) => [k, v.label, counts[k] || 0])];
  $('chips').innerHTML = items.map(([k, label, n]) =>
    `<button class="chip ${filter === k ? 'on' : ''}" data-k="${k}">${label} <span style="opacity:.6">${n}</span></button>`).join('')
    + `<input class="search" id="q" placeholder="搜标题 / 内容 / UP" value="${esc(query)}" />`;
}

function matches(e) {
  if (filter !== 'all' && e.kind !== filter) return false;
  if (!query) return true;
  const hay = `${e.title} ${e.detail} ${e.up} ${e.meta?.replyTo || ''}`.toLowerCase();
  return hay.includes(query.toLowerCase());
}

function rowHtml(e) {
  const k = KINDS[e.kind] || { label: e.kind };
  const link = e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noreferrer">${esc(e.title) || '（无标题）'}</a>` : esc(e.title) || '（无标题）';
  let detail = '';
  if (e.kind === 'comment') {
    const to = e.meta?.replyTo ? `<span class="at">@${esc(e.meta.replyTo)}</span> ` : '';
    detail = `<div class="detail">${to}${esc(e.detail)}</div>`;
  } else if (e.kind === 'dm') {
    detail = `<div class="detail">${esc(e.detail)}</div>`;
  } else if (e.detail) {
    detail = `<div class="detail">${esc(e.detail)}</div>`;
  }
  const tags = [];
  if (e.meta?.form) tags.push(e.meta.form);
  if (e.meta?.mode) tags.push(e.meta.mode === 'full' ? '深看' : e.meta.mode === 'frames' ? '抽帧' : '浅看');
  if (e.meta?.duration) tags.push(e.meta.duration);
  if (e.meta?.tag) tags.push(e.meta.tag);
  if (e.meta?.share) tags.push('分享型');
  if (e.up) tags.push('UP：' + e.up);
  const meta = tags.length ? `<div class="meta">${tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : '';
  return `<div class="row">
    <div class="time">${hhmm(e.at)}</div>
    <div><span class="badge ${e.kind}">${k.label}</span></div>
    <div><div class="title">${link}</div>${detail}${meta}</div>
  </div>`;
}

function renderList() {
  const list = (DATA.events || []).filter(matches);
  if (!list.length) { $('list').innerHTML = '<div class="empty">这个筛选下没有记录</div>'; return; }
  const groups = [];
  let cur = null;
  for (const e of list) {
    const key = dayKey(e.at);
    if (!cur || cur.key !== key) { cur = { key, day: e.at, items: [] }; groups.push(cur); }
    cur.items.push(e);
  }
  $('list').innerHTML = groups.map((g) => {
    const d = new Date(g.day);
    const label = `${d.getMonth() + 1} 月 ${d.getDate()} 日 ${weekday(g.day)}`;
    return `<div class="day"><div class="dayhead"><b>${label}</b><span>${g.items.length} 条</span></div>
      ${g.items.map(rowHtml).join('')}</div>`;
  }).join('');
}

function render() {
  if (!DATA) return;
  $('sub').textContent = `${DATA.character.name}（${DATA.character.id}）· 数据生成于 ${new Date(DATA.generatedAt).toLocaleString('zh-CN')}`;
  renderStats();
  renderChips();
  renderList();
}

async function load() {
  try {
    const res = await fetch('/api/events', { cache: 'no-store' });
    const json = await res.json();
    if (json.ok === false) throw new Error(json.error || '接口返回失败');
    DATA = json;
    render();
  } catch (e) {
    const down = /failed to fetch|load failed|networkerror|network error/i.test(String(e.message || ''));
    $('list').innerHTML = down
      ? `<div class="err"><b>连不上后台服务</b>（${esc(e.message)}）<br>
          大概是被 DSH 重启带走了。重新起一下：<br>
          <code>node ~/SurfCore/scripts/bili-footprint/start.mjs</code><br>
          起来之后这个页面 30 秒内会自己恢复，不用刷新。</div>`
      : `<div class="err">读取失败：${esc(e.message)}</div>`;
    $('sub').textContent = '后台未连接';
  }
}

document.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (chip) {
    filter = chip.dataset.k;
    renderChips(); renderList();
  }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { query = e.target.value; renderList(); }
});
$('refresh').onclick = load;
$('auto').onclick = () => {
  autoOn = !autoOn;
  $('auto').textContent = `自动刷新：${autoOn ? '开' : '关'}`;
  if (autoOn) { clearInterval(autoTimer); autoTimer = setInterval(load, 30000); }
  else clearInterval(autoTimer);
};

load();
autoTimer = setInterval(load, 30000);
</script>
</body>
</html>
